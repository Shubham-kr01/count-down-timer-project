<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>countdown pro</title>
      <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <div class="wrapper">
        <h1>Countdown Timer</h1>
        <div class="countdown">
            <div id="days"><span>00</span>Days</div>
            <div id="hours"><span>00</span>Hours</div>
            <div id="minutes"><span>00</span>Mins</div>
            <div id="seconds"><span>00</span>Secs</div>
        </div>
        <h2>Progress</h2>
        <div class="progress-bar">
         <div class="progress-fill"></div>   
        </div>
        </div>
        <h3>Jo piye Pepsi, wo ho jaye sexyyy</h3>
    </div>
    <script src="script.js"></script>
</body>
</html>
